<ng-container *ngIf="(state$ | async) as state">
  <div 
    (click)="toggleGarage($event)" 
    class="garage_door_icon" 
    [ngClass]="{'open': state?.open }">
      {{ garageLabel(state) }}
      <mat-icon class="offline" *ngIf="(connected$ | async) == false">offline_bolt</mat-icon>
  </div>
</ng-container>
